services:
  - type: web
    name: stock-analyst-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENABLE_LIVE_SCAN
        value: "0"
      # Single shared site password. Set the real value in the Render dashboard
      # (Environment tab) — never commit it here. Its presence turns on auth.
      - key: APP_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GH_REPO
        value: eliorbudkov/stockanalyst.github.io
      - key: GH_WORKFLOW
        value: refresh-seed.yml
      - key: GH_REF
        value: main
      - key: GH_DISPATCH_TOKEN
        sync: false
