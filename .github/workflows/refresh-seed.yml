name: Refresh scan seed

# Regenerates the committed cold-start seed (backend/data/scan.json) ON DEMAND.
# The in-app "scan" button calls the backend (POST /api/scan/trigger), which
# dispatches this workflow so the heavy scan runs on GitHub's 7GB runners — not
# the 512MB Render dyno, which OOMs. The push of the regenerated seed triggers
# Render's auto-deploy, baking fresh data into the deploy image.
on:
  # On-demand only — no schedule. The scan runs only when the user clicks "scan",
  # to conserve resources. Still runnable manually from the Actions tab.
  workflow_dispatch: {}

# Allow the default GITHUB_TOKEN to push the regenerated seed back to main.
permissions:
  contents: write

# Never let two refreshes overlap.
concurrency:
  group: refresh-seed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Regenerate scan seed
        run: python backend/refresh_seed.py

      - name: Commit & push if the seed changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/scan.json backend/data/universe.json
          if git diff --staged --quiet; then
            echo "Seed unchanged — nothing to commit."
          else
            git commit -m "chore(seed): scheduled scan-seed refresh"
            git push
          fi
